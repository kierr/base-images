name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '37 * * * *' # Every hour
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-ruby-34:
    name: Ruby 3.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: images/ruby
          file: images/ruby/Dockerfile
          target: dev
          build-args: RUBY_VERSION=3.4.10-pshopify1
          load: true
          tags: ruby-dev:validate
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: images/ruby
          file: images/ruby/Dockerfile
          target: runtime
          build-args: RUBY_VERSION=3.4.10-pshopify1
          load: true
          tags: ruby:validate
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan dev image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ruby-dev:validate
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ruby:validate
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dev image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: images/ruby
          file: images/ruby/Dockerfile
          target: dev
          build-args: RUBY_VERSION=3.4.10-pshopify1
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/base-images/ruby:3.4-dev
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish runtime image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: images/ruby
          file: images/ruby/Dockerfile
          target: runtime
          build-args: RUBY_VERSION=3.4.10-pshopify1
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/base-images/ruby:3.4
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

